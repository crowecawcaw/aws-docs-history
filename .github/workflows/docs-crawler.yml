name: Crawl Single Guide

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 'Service guide URL (e.g., /AmazonS3/latest/userguide/ or https://docs.aws.amazon.com/AmazonS3/latest/userguide/)'
        required: true
        type: string
      dry_run:
        description: 'Run in dry-run mode (show what would be crawled without crawling)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  crawl-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl guide
        working-directory: main
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in dry-run mode..."
          fi

          echo "Crawling guide: ${{ inputs.service_url }}"
          python crawler.py crawl-guide "${{ inputs.service_url }}" --output-dir docs $DRY_RUN_FLAG

      - name: Configure Git user
        if: inputs.dry_run != true
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        if: inputs.dry_run != true
        id: commit
        working-directory: main
        run: python commit_changes.py

      - name: Push changes
        if: inputs.dry_run != true && steps.commit.outputs.changes == 'true'
        working-directory: main
        run: git push origin main
