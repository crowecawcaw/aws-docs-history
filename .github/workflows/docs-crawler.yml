name: Docs crawler

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 'Service guide URL to crawl (e.g., https://docs.aws.amazon.com/AmazonS3/latest/userguide/ or /AmazonS3/latest/userguide/). Leave empty to crawl all services.'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode (list guides without crawling)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      service_url:
        description: 'Service guide URL to crawl (e.g., https://docs.aws.amazon.com/AmazonS3/latest/userguide/ or /AmazonS3/latest/userguide/). Leave empty to crawl all services.'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode (list guides without crawling)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        working-directory: main
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in dry-run mode..."
          fi

          if [ -z "${{ inputs.service_url }}" ]; then
            echo "Crawling all services..."
            python crawler.py --output-dir docs $DRY_RUN_FLAG
          else
            echo "Crawling guide: ${{ inputs.service_url }}"
            python crawler.py --output-dir docs --service-url "${{ inputs.service_url }}" $DRY_RUN_FLAG
          fi

      - name: Configure Git user
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        if: inputs.dry_run != true
        id: commit
        working-directory: main
        run: python commit_changes.py

      - name: Push changes
        if: inputs.dry_run != true && steps.commit.outputs.changes == 'true'
        working-directory: main
        run: git push origin main
