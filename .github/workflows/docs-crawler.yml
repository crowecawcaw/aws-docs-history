name: Docs crawler

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service ID to crawl (leave empty to crawl all services)'
        required: false
        type: string
  workflow_call:
    inputs:
      service:
        description: 'Service ID to crawl (leave empty to crawl all services)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        working-directory: main
        run: |
          find docs -mindepth 1 -maxdepth 1 ! -name README.md ! -name service-manifest.json -exec rm -rf {} +

          if [ -z "${{ inputs.service }}" ]; then
            echo "Crawling all services..."
            python crawler.py --output-dir docs
          else
            echo "Crawling service: ${{ inputs.service }}"
            python crawler.py --output-dir docs --service "${{ inputs.service }}"
          fi

      - name: Configure Git user
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        working-directory: main
        run: python commit_changes.py

      - name: Push changes
        if: steps.commit.outputs.changes == 'true'
        working-directory: main
        run: git push origin main
