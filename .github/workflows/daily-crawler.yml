name: Daily crawler

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: main

      - name: Check out docs branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs
          path: docs-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        working-directory: main
        run: |
          python crawler.py --output-dir docs

      - name: Sync markdown docs to docs branch
        run: |
          mkdir -p main/docs docs-repo/docs
          rsync -av --delete --prune-empty-dirs \
            --include '*/' \
            --include '*.md' \
            --exclude '*' \
            main/docs/ docs-repo/docs/

      - name: Configure Git user
        working-directory: docs-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        working-directory: docs-repo
        run: python ../main/commit_changes.py

      - name: Push changes
        if: steps.commit.outputs.changes == 'true'
        working-directory: docs-repo
        run: git push origin docs
