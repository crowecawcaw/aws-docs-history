name: AWS Docs Crawler

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sundays at 3 AM UTC
  workflow_dispatch:
    inputs:
      service_guide_url:
        description: 'Single service guide URL to crawl (e.g., /AmazonS3/latest/userguide/). Leave empty to crawl all guides.'
        required: false
        type: string
      service_guides_start:
        description: 'Resume from this guide (e.g., /AmazonS3/latest/userguide/). Leave empty to start from beginning.'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode (list guides without crawling)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run crawler
        run: |
          # Build command
          CMD="python crawler.py --output-dir docs --commit"

          # Add dry-run flag if specified
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          # Add single guide filter if specified
          if [ -n "${{ inputs.service_guide_url }}" ]; then
            CMD="$CMD --service-guide-url '${{ inputs.service_guide_url }}'"
          fi

          # Add start guide if specified
          if [ -n "${{ inputs.service_guides_start }}" ]; then
            CMD="$CMD --service-guides-start '${{ inputs.service_guides_start }}'"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Push changes
        if: inputs.dry_run != true
        run: git push origin main || echo "No changes to push"
