name: Update Activity Chart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate activity chart
        run: |
          python generate_sparklines.py --update-readme
          if git diff --quiet docs_activity.svg README.md; then
            echo "No chart changes"
          else
            git add docs_activity.svg README.md
            git commit -m "Update documentation activity chart"
            git push
          fi
