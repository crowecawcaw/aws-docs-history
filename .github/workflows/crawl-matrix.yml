name: Crawl Services (Matrix)

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'JSON array of service URLs'
        required: true
        type: string
  workflow_call:
    inputs:
      services:
        description: 'JSON array of service URLs'
        required: true
        type: string

permissions:
  contents: write

# Ensure only one crawl workflow runs at a time
concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix }}
    steps:
      - name: Batch services
        id: batch
        run: |
          # Parse input services JSON array
          SERVICES='${{ inputs.services }}'
          echo "Input services: $SERVICES"

          # Batch into groups of 2
          MATRIX=$(echo "$SERVICES" | python3 -c "
          import json
          import sys

          services = json.load(sys.stdin)
          batch_size = 2

          # Create batches
          batches = []
          for i in range(0, len(services), batch_size):
            batch = services[i:i+batch_size]
            batch_str = ','.join(batch)
            batches.append({
              'service_batch': batch_str,
              'batch_id': str(i // batch_size + 1)
            })

          output = {'include': batches}
          print(json.dumps(output))
          ")

          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  crawl:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false  # Continue even if one job fails
      max-parallel: 1   # Serial execution (change to higher number for parallel)

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install dependencies
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl services (batch ${{ matrix.batch_id }})
        working-directory: main
        run: |
          echo "Crawling services: ${{ matrix.service_batch }}"
          python crawler.py crawl-services "${{ matrix.service_batch }}" --output-dir docs

      - name: Configure Git user
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        working-directory: main
        run: python commit_changes.py

      - name: Push changes
        if: steps.commit.outputs.changes == 'true'
        working-directory: main
        run: git push origin main
